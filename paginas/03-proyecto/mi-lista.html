<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Configura idioma, escala, icono de pestaña y estilos de la página. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../../imagenes/domiflix-logo.png">
    <link rel="stylesheet" href="../../css/style.css">
    <script src="../../js/perfil.js" defer></script>
    <title>Mi lista</title>
</head>
<body>
    <!-- Cabecera compartida por las secciones del proyecto. -->
    <header class="netflix-menu" aria-label="Menú principal de Netflix">
        <!-- Enlace con el logo para volver a la página de inicio. -->
        <a class="logo" href="inicio.html" aria-label="Domiflix, inicio"><img src="../../imagenes/domiflix-logo.png" alt="DOMIFLIX"></a>
        <!-- Navegación horizontal; Mi lista se marca como sección actual. -->
        <nav class="desktop-links" aria-label="Navegación principal"><ul class="links">
            <li><a href="inicio.html">Inicio</a></li><li><a href="series.html">Series</a></li><li><a href="peliculas.html">Películas</a></li>
            <li><a href="novedades-populares.html">Novedades populares</a></li>
            <li><a class="active" href="mi-lista.html">Mi lista</a></li><li><a href="explorar-idiomas.html">Explorar por idiomas</a></li>
        </ul></nav>
        <!-- Alternativa plegable a los enlaces cuando la pantalla es pequeña. -->
        <details class="mobile-menu"><summary>Explorar <span class="chevron" aria-hidden="true"></span></summary><nav aria-label="Navegación principal"><ul class="links">
            <li><a href="inicio.html">Inicio</a></li><li><a href="series.html">Series</a></li><li><a href="peliculas.html">Películas</a></li>
            <li><a href="novedades-populares.html">Novedades populares</a></li>
            <li><a class="active" href="mi-lista.html">Mi lista</a></li><li><a href="explorar-idiomas.html">Explorar por idiomas</a></li>
        </ul></nav></details>
        <!-- Agrupa el buscador y el menú para cambiar de usuario. -->
        <div class="tools">
            <!-- Buscador plegable con icono de lupa y campo de texto. -->
            <details class="search"><summary class="icon-button" aria-label="Abrir buscador"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 5 5"></path></svg></summary><input type="search" placeholder="Buscar títulos..." aria-label="Buscar títulos"></details>
            <!-- Permite elegir un perfil mediante su avatar, sin JavaScript. -->
            <details class="profile-switch"><summary class="profile" aria-label="Cambiar de usuario"><span class="avatar" aria-hidden="true"><span class="avatar-option" id="anxo"><img src="../../imagenes/anxo.png" alt=""></span><span class="avatar-option" id="diego">D</span><span class="avatar-option" id="bampe">B</span><span class="avatar-default">🙂</span></span><span class="chevron" aria-hidden="true"></span></summary>
                <nav class="profile-options" aria-label="Cambiar de usuario"><a href="proyecto.html#anxo" aria-label="Anxo"><span class="avatar" aria-hidden="true"><img src="../../imagenes/anxo.png" alt=""></span><span class="profile-option-name">Anxo</span></a><a href="proyecto.html#diego" aria-label="Diego"><span class="avatar" aria-hidden="true">D</span><span class="profile-option-name">Diego</span></a><a href="proyecto.html#bampe" aria-label="Bampe"><span class="avatar" aria-hidden="true">B</span><span class="profile-option-name">Bampe</span></a></nav>
            </details>
        </div>
    </header>
</body>
</html>
