<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Configura la página y el color que puede usar el navegador en su interfaz. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111111">
    <!-- Carga el icono de pestaña y los estilos del menú y las transiciones. -->
    <link rel="icon" type="image/png" href="../../imagenes/domiflix-logo.png">
    <title>Menú de Domiflix</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/entrada.css">
    <script src="../../js/perfil.js" defer></script>
</head>
<body>
    <!-- Cabecera principal: logo, navegación y controles de la cuenta. -->
    <header class="netflix-menu" aria-label="Menú principal de Netflix">
        <!-- El logo también enlaza con la página de inicio del proyecto. -->
        <a class="logo" href="inicio.html" aria-label="Domiflix, inicio"><img src="../../imagenes/domiflix-logo.png" alt="DOMIFLIX"></a>

        <!-- Enlaces visibles en pantallas grandes; marca Inicio como sección activa. -->
        <nav class="desktop-links" aria-label="Navegación principal">
            <ul class="links">
                <li><a class="active" href="inicio.html">Inicio</a></li>
                <li><a href="series.html">Series</a></li>
                <li><a href="peliculas.html">Películas</a></li>
                <li><a href="novedades-populares.html">Novedades populares</a></li>
                <li><a href="mi-lista.html">Mi lista</a></li>
                <li><a href="explorar-idiomas.html">Explorar por idiomas</a></li>
            </ul>
        </nav>

        <!-- Menú plegable que ofrece las mismas secciones en pantallas pequeñas. -->
        <details class="mobile-menu">
            <summary>Explorar <span class="chevron" aria-hidden="true"></span></summary>
            <nav aria-label="Navegación principal">
                <ul class="links">
                    <li><a class="active" href="inicio.html">Inicio</a></li>
                    <li><a href="series.html">Series</a></li>
                    <li><a href="peliculas.html">Películas</a></li>
                    <li><a href="novedades-populares.html">Novedades populares</a></li>
                    <li><a href="mi-lista.html">Mi lista</a></li>
                    <li><a href="explorar-idiomas.html">Explorar por idiomas</a></li>
                </ul>
            </nav>
        </details>

        <!-- Reúne el buscador y el selector de usuario en el extremo de la cabecera. -->
        <div class="tools">
            <!-- details y summary permiten abrir el buscador sin JavaScript. -->
            <details class="search">
                <summary class="icon-button" aria-label="Abrir buscador">
                    <!-- Dibuja el icono de lupa con SVG. -->
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="10.8" cy="10.8" r="6.8"></circle>
                        <path d="m16 16 5 5"></path>
                    </svg>
                </summary>
                <!-- Campo para escribir títulos que se quieran buscar. -->
                <input type="search" placeholder="Buscar títulos..." aria-label="Buscar títulos">
            </details>
            <!-- El fragmento de la URL selecciona el avatar mostrado con CSS. -->
            <details class="profile-switch">
                <summary class="profile" aria-label="Cambiar de usuario">
                    <span class="avatar" aria-hidden="true">
                        <span class="avatar-option" id="anxo"><img src="../../imagenes/anxo.png" alt=""></span>
                        <span class="avatar-option" id="diego">D</span>
                        <span class="avatar-option" id="bampe">B</span>
                        <span class="avatar-default">🙂</span>
                    </span>
                    <span class="chevron" aria-hidden="true"></span>
                </summary>
                <!-- Cada avatar enlaza con su perfil; Anxo usa su foto y faltan las de Diego y Bampe. -->
                <nav class="profile-options" aria-label="Cambiar de usuario">
                    <a href="proyecto.html#anxo" aria-label="Anxo"><span class="avatar" aria-hidden="true"><img src="../../imagenes/anxo.png" alt=""></span><span class="profile-option-name">Anxo</span></a>
                    <a href="proyecto.html#diego" aria-label="Diego"><span class="avatar" aria-hidden="true">D</span><span class="profile-option-name">Diego</span></a>
                    <a href="proyecto.html#bampe" aria-label="Bampe"><span class="avatar" aria-hidden="true">B</span><span class="profile-option-name">Bampe</span></a>
                </nav>
            </details>
        </div>
    </header>
</body>
</html>
